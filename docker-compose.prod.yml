services:
  nginx:
    image: nginx:alpine
    container_name: workpilot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/aws/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - server
      - client
    networks:
      - workpilot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: workpilot_server
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-}
      CLIENT_URL: ${CLIENT_URL:-https://app.workpilot.io}
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      UNIPILE_WEBHOOK_SECRET: ${UNIPILE_WEBHOOK_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_PLAN_PRO_MONTHLY: ${RAZORPAY_PLAN_PRO_MONTHLY}
      RAZORPAY_PLAN_PRO_YEARLY: ${RAZORPAY_PLAN_PRO_YEARLY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UNIPILE_DSN: ${UNIPILE_DSN}
      UNIPILE_API_KEY: ${UNIPILE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - workpilot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.workpilot.io}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://api.workpilot.io}
    container_name: workpilot_client
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=400"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.workpilot.io}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://api.workpilot.io}
    expose:
      - "3000"
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - workpilot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  workpilot_network:
    driver: bridge
